<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <head>
  <title>QR code component</title>
</head>
  
  <style>
    
  * {
    background-color: white;

  }

  .fundo {
    background-color:  hsl(212, 45%, 89%);
    width: 100vw;
    height: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .imagem {
    display: flex;
    justify-content: center;
    flex-direction:column;
    align-items: center;
    width: 450px;
    height: 650px;
    border-radius: 15px;
  }

  img {
    width: 370px;
    height: 400px;
    border-radius: 15px;
  }

  h3 {
    font-size: 20px;
    font-family: 'Outfit', sans-serif;
    color: hsl(218, 44%, 22%);
    text-align: center;
    margin: 10px;
    padding: 10px;
  }

  p {
    font-size: 18px;
    text-align: center;
    font-family: 'Outfit', sans-serif;
    color: hsl(216, 15%, 48%);
    margin: 15px;
    padding: 10px;
  }

    footer {
    display: flex;
    width: 100vw;
    height: 200px;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    background-color: hsl(214, 65%, 25%);
    border-radius: 10px;

  }

  footer p, a {
    text-decoration: none;
    color: hsl(212, 45%, 89%);
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    background-color: hsl(214, 65%, 25%);
  }

  footer a:hover {
    color: black;
    font-size: 25px;
  }

  @media (max-width: 600px) {
    html {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: auto;
      height: 100%;

    }
      .fundo {
    display: flex;
    flex-direction:column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 500px;

  }

  img {
    width: 300px;
    height: 300px;
  }

  h3 {
    font-size: 15px;
    width: 200px;
  }

  p {
    font-size: 13px;
    margin: 10px;
    padding: 15px;
    width: 250px;
    height: 30px;
    display: flex;
    flex-direction: row;
    text-align: center;
    justify-content: center;
    align-items: center;
  }

  footer {
    width: 100%;
    display:flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    height: 80px;
    font-size: 18px;


}
}

@media (min-width: 600px){
  html {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: auto;
      height: 100%;
  }
  .fundo {
    background-color:  hsl(212, 45%, 89%);
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  footer {
    width: 100%;
    display:flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    height: 80px;
    font-size: 18px;

}
}
  </style>
<body>

  <main>
    <div class="fundo">
    <div class="imagem">
    <img src="images/image-qr-code.png" alt="imagem-qr code">
    <h3>Improve your front-end skills by building projects</h3>
    <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>
  
  <footer class="rodape">
    <p>Coded by <a href=" https://github.com/LucasCorreiaDeveloper " target="_blank"> Lucas Correia </a></p>
  </footer>
  </div>
</body>
</html>
